          [[ -n "$VITE_SUPABASE_ANON_KEY" ]]
      - uses: actions/checkout@v4
        with:
          repository: Nabster77/WoodMo_V3.0
          ref: 1ec5855d459baf9b219f0818540ad01d33997c84
          fetch-depth: 0
