name: WOODMO TEST on GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-test.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: woodmo-test-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'TESTwoodmo/testwoodmo.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      VITE_DEPLOY_BASE: /
      VITE_SUPABASE_URL: https://qpoafsvsnrwfpvlizkpq.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_PUBLISHABLE_KEY }}
      TEST_SUPABASE_REF: qpoafsvsnrwfpvlizkpq
    steps:
      - name: Require isolated database
        shell: bash
        run: |
          set -eu
          [[ "$TEST_SUPABASE_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$TEST_SUPABASE_REF" != tulndunkpsynkbbebenf && "$TEST_SUPABASE_REF" != fsztsmnxbffanyfbytnr ]]
