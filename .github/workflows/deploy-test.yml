      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Label test build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          assert '</body>' in html
          badge = '<div style="position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:2147483647;background:#ffbf47;color:#161616;padding:3px 10px;font:bold 14px sans-serif;pointer-events:none">WOODMO TEST</div>'
          page.write_text(html.replace('</body>', badge + '</body>', 1), encoding='utf-8')
          config = Path('vite.config.ts')
          vite = config.read_text(encoding='utf-8')
          assert "short_name: 'WOODMO V3'" in vite
          config.write_text(vite.replace("name: 'WOODMO Kassen-App Version 3.0'", "name: 'WOODMO TEST'").replace("short_name: 'WOODMO V3'", "short_name: 'WOODMO TEST'"), encoding='utf-8')
          PY
      - run: npm ci
      - name: Build test app
        run: npm run build
      - name: Reject production endpoints in build
        run: |
          node -e 'if (JSON.parse(require("fs").readFileSync("dist/version.json", "utf8")).version !== "3.33.1") process.exit(1)'
          grep -q 'WOODMO TEST' dist/index.html
          grep -q 'WOODMO TEST' dist/manifest.webmanifest
          grep -qrF "$VITE_SUPABASE_URL" dist/assets
          if grep -qrE 'tulndunkpsynkbbebenf|fsztsmnxbffanyfbytnr' dist; then
            echo 'The live V3 endpoint is present in the test build.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for GitHub Pages artifact indexing
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: deploy
        continue-on-error: true
      - name: Wait before retrying Pages
        if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - uses: actions/deploy-pages@v4
        if: steps.deploy.outcome == 'failure'
